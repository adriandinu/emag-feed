name: Update eMAG Feed

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */2 * * *'

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate feed
        run: |
          python3 << 'EOF'
          import urllib.request
          import re

          FEED_URL = "https://www.adsolutiielectrice.ro/feed/emag/daf7bd3c466f5a01428831de88659e43"

          req = urllib.request.Request(
              FEED_URL,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          xml = urllib.request.urlopen(req).read().decode("utf-8")

          def get_multiplier(price):
              if price < 500:
                  return 1.25      # +25%
              elif price <= 2000:
                  return 1.21      # +21%
              else:
                  return 1.19      # +19%

          def repl(match):
              txt = match.group(1)

              try:
                  price = float(
                      txt.replace("RON", "")
                         .replace(",", ".")
                         .strip()
                  )
              except:
                  return match.group(0)

              new_price = round(price * get_multiplier(price))

              return f"<price>{new_price} RON</price>"

          xml = re.sub(
              r"<price>(.*?)</price>",
              repl,
              xml,
              flags=re.IGNORECASE | re.DOTALL
          )

          with open("emag-feed.xml", "w", encoding="utf-8") as f:
              f.write(xml)

          EOF

      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add emag-feed.xml

          git diff --cached --quiet || git commit -m "Update feed"

          git push
