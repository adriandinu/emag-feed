name: Update eMAG Feed

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */2 * * *'

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate feed
        run: |
          python3 << 'EOF'
          import urllib.request
          import re

          FEED_URL = "https://www.adsolutiielectrice.ro/feed/emag/daf7bd3c466f5a01428831de88659e43"

          EMAG_COMMISSION = 0.18
          TVA_COMMISSION = 0.21

          # Cost real comision pentru neplatitor TVA:
          # 18% + TVA 21% pe comision = 21.78%
          REAL_COMMISSION_COST = EMAG_COMMISSION * (1 + TVA_COMMISSION)

          req = urllib.request.Request(
              FEED_URL,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          xml = urllib.request.urlopen(req).read().decode("utf-8")

          def extra_margin(price):
              if price < 500:
                  return 0.08   # +8% peste acoperirea comisionului
              elif price <= 2000:
                  return 0.04   # +4%
              else:
                  return 0.01   # +1%

          def calculate_emag_price(site_price):
              # Preț minim ca dupa comision sa ramai cu pretul de pe site
              base_price = site_price / (1 - REAL_COMMISSION_COST)

              # Marja suplimentara
              final_price = base_price * (1 + extra_margin(site_price))

              # Fara zecimale
              return round(final_price)

          def repl(match):
              txt = match.group(1)

              try:
                  site_price = float(
                      txt.replace("RON", "")
                         .replace(",", ".")
                         .strip()
                  )
              except:
                  return match.group(0)

              emag_price = calculate_emag_price(site_price)

              return f"<price>{emag_price} RON</price>"

          xml = re.sub(
              r"<price>(.*?)</price>",
              repl,
              xml,
              flags=re.IGNORECASE | re.DOTALL
          )

          with open("emag-feed.xml", "w", encoding="utf-8") as f:
              f.write(xml)

          EOF

      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add emag-feed.xml

          git diff --cached --quiet || git commit -m "Update feed"

          git push
